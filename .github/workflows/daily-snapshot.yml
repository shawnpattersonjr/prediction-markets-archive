name: Daily election markets

on:
  schedule:
    - cron: "7 13 * * *"   # 13:07 UTC daily; GitHub may start it late
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: archive-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # room for the 1-hour retry below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe intraday granularity (temporary)
        run: python probe_intraday.py
