name: Daily election markets

on:
  schedule:
    - cron: "7 13 * * *"   # 13:07 UTC daily; GitHub may start it late
  workflow_dispatch:        # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: archive-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # room for the 1-hour retry below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Snapshot markets
        id: snap
        run: python run_snapshot.py
        continue-on-error: true   # still commit whatever sources succeeded
      - name: Commit new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Election markets $(date -u +%F)"
          git pull --rebase -q && git push
      - name: Retry failed sources after 1 hour
        id: retry
        if: steps.snap.outcome == 'failure'
        run: |
          sleep 3600
          python run_snapshot.py   # sources saved in the first pass are skipped
        continue-on-error: true
      - name: Commit retried sources
        if: steps.snap.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Election markets $(date -u +%F)"
          git pull --rebase -q && git push
      - name: Fail the run if any source still failed
        if: steps.snap.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: exit 1
